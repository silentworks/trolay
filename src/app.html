<!doctype html>
<html lang="en-GB">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="text-scale" content="scale" />
		<meta name="description" content="Snap shelf prices and keep a running total of your shop." />
		<meta name="theme-color" content="#f6f8fc" />
		<script>
			// The saved look (src/lib/theme.ts), before the first paint so it doesn't flash.
			(function () {
				let theme = 'light';
				try {
					theme = localStorage.getItem('trolley.theme') || 'light';
				} catch {}
				const dark =
					theme === 'dark' ||
					(theme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
				document.documentElement.dataset.theme = dark ? 'dark' : 'light';
				if (dark) document.querySelector('meta[name="theme-color"]').content = '#0b0f17';
			})();
		</script>
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<meta name="apple-mobile-web-app-title" content="Trolay" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<link rel="icon" href="%sveltekit.assets%/icons/icon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/icons/apple-touch-icon.png" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
