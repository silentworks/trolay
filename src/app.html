<!doctype html>
<html lang="en-GB">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
		/>
		<meta name="text-scale" content="scale" />
		<meta name="description" content="Snap shelf prices and keep a running total of your shop." />
		<meta name="theme-color" content="#f6f8fc" />
		<!-- The saved look, before the first paint so it doesn't flash. A file, not inline, so the
		     Content-Security-Policy allows no inline scripts but SvelteKit's own. -->
		<script src="%sveltekit.assets%/theme.js"></script>
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<meta name="apple-mobile-web-app-title" content="Trolay" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<link
			rel="icon"
			href="%sveltekit.assets%/icons/favicon-32.png"
			type="image/png"
			sizes="32x32"
		/>
		<link rel="icon" href="%sveltekit.assets%/icons/icon.svg" type="image/svg+xml" />
		<link
			rel="apple-touch-icon"
			href="%sveltekit.assets%/icons/apple-touch-icon.png"
			sizes="180x180"
		/>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
