<!doctype html>
<html lang="en-GB">

		<meta name="description" content="Snap shelf prices and keep a running total of your shop." />
		<meta name="theme-color" content="#0b6b62" media="(prefers-color-scheme: light)" />

		<meta name="apple-mobile-web-app-capable" content="yes" />

		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<link rel="icon" href="%sveltekit.assets%/icons/icon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/icons/apple-touch-icon.png" />
		%sveltekit.head%

	<body data-sveltekit-preload-data="hover">
